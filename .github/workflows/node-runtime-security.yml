name: Node runtime security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  node-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: node scripts/check-node-version.cjs
      - run: node --test scripts/check-node-version-check.cjs
